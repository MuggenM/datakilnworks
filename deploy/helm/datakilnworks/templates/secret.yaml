{{- if not .Values.secrets.existingSecret }}
{{- $name := include "dkw.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.secrets.computeToken }}
{{- if and (not $token) $existing }}{{- if hasKey $existing.data "COMPUTE_TOKEN" }}{{- $token = index $existing.data "COMPUTE_TOKEN" | b64dec }}{{- end }}{{- end }}
{{- if not $token }}{{- $token = randAlphaNum 40 }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "dkw.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.initAdminPasswordHash }}
  INIT_ADMIN_PASSWORD_HASH: {{ .Values.secrets.initAdminPasswordHash | quote }}
  {{- end }}
  COMPUTE_TOKEN: {{ $token | quote }}         # kept across upgrades: the studio and the compute nodes must agree
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
