# Backend services for the tests (design: proposals/ci-services.md). Test data only: every login here is a dummy value.
# Start with ci/services/up.sh <profile>..., stop with ci/services/down.sh. Project name dkwci, no published ports:
# a test reaches a service by its name on the network dkwci_default (ci/run_test.sh with CI_SERVICES joins it).
# Images are pinned by tag; Dependabot (docker-compose ecosystem) proposes updates.
name: dkwci

# Every service: no DNS search domain. Docker copies the host's, and on a machine whose search domain resolves unknown names
# (this dev machine's does, to an outside host) a client that tries `<name>.<domain>` first (curl does) connects there
# instead of to the service on this network.
x-no-search: &no-search
  dns_search: .

services:
  # ---------------------------------------------------------------- profile ldap
  lldap:
    image: lldap/lldap:v0.6.2-alpine           # latest stable release on 2026-11-28
    profiles: [ldap]
    <<: *no-search
    environment:
      LLDAP_JWT_SECRET: dkwci-test-jwt-secret-not-a-real-one
      LLDAP_KEY_SEED: dkwci-test-key-seed-not-a-real-one
      LLDAP_LDAP_BASE_DN: dc=example,dc=com
      LLDAP_LDAP_USER_PASS: adminpassword
    volumes:
      - lldap-data:/data
    healthcheck:
      test: ["CMD", "/app/lldap", "healthcheck", "--config-file", "/data/lldap_config.toml"]
      interval: 2s
      timeout: 5s
      retries: 60

  lldap-seed:                                   # users, groups, memberships and passwords through lldap's own bootstrap script
    image: lldap/lldap:v0.6.2-alpine
    profiles: [ldap]
    <<: *no-search
    depends_on:
      lldap: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /app/bootstrap.sh
        cat > /out/ldap.env <<'ENV'
        LLDAP_TEST_HOST=lldap
        LLDAP_BIND_DN=uid=admin,ou=people,dc=example,dc=com
        LLDAP_BIND_PASSWORD=adminpassword
        LLDAP_BASE_DN=dc=example,dc=com
        LLDAP_USER_PASSWORD=Password123!
        ENV
    environment:
      LLDAP_URL: http://lldap:17170
      LLDAP_ADMIN_USERNAME: admin
      LLDAP_ADMIN_PASSWORD: adminpassword
      USER_CONFIGS_DIR: /seed/users
      GROUP_CONFIGS_DIR: /seed/groups
    volumes:
      - ./seed/lldap:/seed:ro
      - ./out:/out

  # ---------------------------------------------------------------- profile git
  gitea:
    image: gitea/gitea:1.22-rootless
    profiles: [git]
    <<: *no-search
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000
      GITEA__server__DOMAIN: gitea
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60

  git-seed:                                     # user ga, an all-scopes token, the empty repos the four git tests use
    image: gitea/gitea:1.22-rootless
    profiles: [git]
    <<: *no-search
    depends_on:
      gitea: {condition: service_healthy}
    user: root                                  # writes out/git.env; the gitea commands themselves run as `git` (su)
    entrypoint: ["/bin/sh", "/seed/gitea.sh"]
    volumes:                                    # the server's own data + config: `gitea admin` works on its database
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - ./seed/gitea.sh:/seed/gitea.sh:ro
      - ./out:/out

  # ---------------------------------------------------------------- profile kafka
  # Two plain clusters (test_stream_ops moves a stream between clusters) and one that requires a SCRAM login.
  redpanda: &redpanda
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    profiles: [kafka]
    <<: *no-search
    command: [redpanda, start, --smp, "1", --memory, 512M, --overprovisioned, --node-id, "0", --mode, dev-container,
              --kafka-addr, "internal://0.0.0.0:9092", --advertise-kafka-addr, "internal://redpanda:9092"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9644/v1/status/ready"]
      interval: 2s
      timeout: 5s
      retries: 60

  redpanda2:
    <<: *redpanda
    command: [redpanda, start, --smp, "1", --memory, 512M, --overprovisioned, --node-id, "0", --mode, dev-container,
              --kafka-addr, "internal://0.0.0.0:9092", --advertise-kafka-addr, "internal://redpanda2:9092"]

  redpanda-sasl:
    <<: *redpanda
    command: [redpanda, start, --smp, "1", --memory, 512M, --overprovisioned, --node-id, "0", --mode, dev-container,
              --kafka-addr, "internal://0.0.0.0:9092", --advertise-kafka-addr, "internal://redpanda-sasl:9092",
              --set, redpanda.enable_sasl=true, --set, 'redpanda.superusers=["dkwci"]']

  kafka-seed:                                   # the SCRAM user of redpanda-sasl, a cluster id on every cluster
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    profiles: [kafka]
    user: root                                  # the image's own user cannot write out/
    <<: *no-search
    depends_on:
      redpanda: {condition: service_healthy}
      redpanda2: {condition: service_healthy}
      redpanda-sasl: {condition: service_healthy}
    entrypoint: ["/bin/bash", "/seed/kafka.sh"]
    volumes:
      - ./seed/kafka.sh:/seed/kafka.sh:ro
      - ./out:/out

  # ---------------------------------------------------------------- profile azure
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    profiles: [azure]
    <<: *no-search
    # --skipApiVersionCheck: a recent azure-storage-blob sends an API version Azurite does not know yet
    command: [azurite-blob, --blobHost, 0.0.0.0, --skipApiVersionCheck, --location, /data]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 2s
      timeout: 5s
      retries: 60

  azure-seed:                                   # nothing to create (Azurite's account and key are the well-known dev ones)
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    profiles: [azure]
    <<: *no-search
    depends_on:
      azurite: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "echo AZURITE_HOST=azurite > /out/azure.env"]
    volumes:
      - ./out:/out

  # ---------------------------------------------------------------- profile s3
  garage:                                       # Deuxfleurs Garage, a real S3 implementation (stands in for S3 and GCS)
    image: dxflrs/garage:v1.0.1
    profiles: [s3]
    <<: *no-search
    volumes:
      - ./seed/garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/tmp
    healthcheck:
      test: ["CMD", "/garage", "node", "id", "-q"]
      interval: 2s
      timeout: 5s
      retries: 60

  s3-seed:                                      # layout, key `test` (may create buckets), through Garage's admin API
    image: python:3.11-slim
    profiles: [s3]
    <<: *no-search
    depends_on:
      garage: {condition: service_healthy}
    entrypoint: ["python", "-I", "/seed/garage.py"]
    volumes:
      - ./seed/garage.py:/seed/garage.py:ro
      - ./out:/out

  # ---------------------------------------------------------------- profile sftp
  sftp:                                         # OpenSSH: user/pass `user`/`pass`, folder /upload, plus a key pair made at start
    image: atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
    profiles: [sftp]
    <<: *no-search
    command: ["user:pass:::upload"]
    volumes:
      - ./seed/sftp.sh:/etc/sftp.d/dkwci-key.sh:ro    # run by the image's entrypoint before sshd starts
      - ./out:/out
    healthcheck:
      test: ["CMD", "bash", "-c", "test -s /out/sftp/id && echo > /dev/tcp/127.0.0.1/22"]
      interval: 2s
      timeout: 5s
      retries: 60

  sftp-seed:
    image: atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
    profiles: [sftp]
    <<: *no-search
    depends_on:
      sftp: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "printf 'SFTP_HOST=sftp\\nSFTP_KEY=/services/sftp/id\\n' > /out/sftp.env"]
    volumes:
      - ./out:/out

  # ---------------------------------------------------------------- profile idp
  # Keycloak for SAML and OIDC: realm dkw from seed/keycloak-realm.json (users alice/alicepw in LakehouseAdmins and
  # bob/bobpw, SAML client urn:dkw:keycloak-test, OIDC client dkw-oidc). Its URLs (issuer, login page) are built from
  # KC_HOSTNAME: the service name, or http://localhost:<port> when up.sh publishes it for a browser on the host
  # (CI_SERVICES_PUBLISH=keycloak:8180:8080 sets DKWCI_PUBLISHED_KEYCLOAK).
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    profiles: [idp]
    <<: *no-search
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dkwci-test-admin-password
      KC_HOSTNAME: ${DKWCI_PUBLISHED_KEYCLOAK:-http://keycloak:8080}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./seed/keycloak-realm.json:/opt/keycloak/data/import/dkw.json:ro
    healthcheck:                                # no curl in the image: plain HTTP over bash's /dev/tcp to the management port
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 5s
      retries: 80

  idp-seed:
    image: python:3.11-slim
    profiles: [idp]
    <<: *no-search
    depends_on:
      keycloak: {condition: service_healthy}
    entrypoint: ["python", "-I", "/seed/idp.py"]
    volumes:
      - ./seed/idp.py:/seed/idp.py:ro
      - ./out:/out

volumes:
  lldap-data:
  gitea-data:
  gitea-config:
  garage-data:
