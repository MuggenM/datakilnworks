# Known vulnerabilities in what the studio image ships: the Python packages (pip-audit) and the OS / other packages (Trivy).
# Runs on every push and pull request and weekly, because new advisories appear without any change here. Fixes arrive as
# Dependabot pull requests (.github/dependabot.yml). Reproduce locally: ci/pip_audit.sh and ci/trivy_scan.sh, see ci/README.md.
name: Supply chain

on:
  push:
    branches: [development, main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: localspark-lakehouse-notebook

jobs:
  scan:
    name: Image vulnerabilities (pip-audit, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the studio image (layers cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
          no-cache: ${{ github.event_name == 'schedule' }}       # the weekly run rebuilds from scratch, so it sees today's packages
      - name: Python packages (pip-audit)
        run: ci/pip_audit.sh
      - name: OS and other packages (Trivy)
        if: always()
        run: ci/trivy_scan.sh
