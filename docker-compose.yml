services:
  datakilnworks-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: localspark-lakehouse-notebook
    container_name: local-datakilnworks-studio
    depends_on:
      datakilnworks-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    command: ["python", "-m", "uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers", "--reload"]
    ports:
      - "${STUDIO_PORT:-8891}:8000"
    environment: &studio-env
      - WAREHOUSE_DIR=/workspace/warehouse
      - WH_STARTER_ENDPOINT=http://compute-node-01:8001
      - WH_ANALYTICS_ENDPOINT=http://compute-node-02:8002
      - WH_ETL_ENDPOINT=http://compute-node-03:8003
      # Bootstrap-only: consulted once, only if the users table is empty (a brand-new warehouse volume).
      # Generate INIT_ADMIN_PASSWORD_HASH with `docker compose exec datakilnworks-studio python -m web.auth hash-password`
      # and set these in .env -- see web/auth.py::_init_admin_from_env. Never affects an already-seeded warehouse.
      - INIT_ADMIN_USERNAME=${INIT_ADMIN_USERNAME:-}
      - INIT_ADMIN_PASSWORD_HASH=${INIT_ADMIN_PASSWORD_HASH:-}
      - INIT_ADMIN_DISPLAY_NAME=${INIT_ADMIN_DISPLAY_NAME:-}
      # Idle SQL warehouses are really suspended (their compute-node container stopped) after `auto_stop_mins`, and resumed
      # by the next query. `pause` freezes the container instead of stopping it (instant resume, memory stays allocated).
      - WAREHOUSE_SUSPEND_MODE=${WAREHOUSE_SUSPEND_MODE:-stop}
      # Git sync of the dbt project (Transformations > Project files > Git). Off unless GIT_REMOTE_URL is set. See .env.example.
      - GIT_REMOTE_URL=${GIT_REMOTE_URL:-}
      - GIT_BRANCH=${GIT_BRANCH:-main}
      - GIT_TOKEN=${GIT_TOKEN:-}
      # direct (default) | pull_request: commit to a change branch and open a pull request on the server (Gitea API) instead of pushing to the base branch
      - GIT_MODE=${GIT_MODE:-direct}
      - GIT_API_URL=${GIT_API_URL:-}
      # gitea | github | gitlab (default: guessed from the host name of the remote URL)
      - GIT_FORGE=${GIT_FORGE:-}
      # Git sync of the shared notebooks (Workspace > Git; only notebooks/Shared). The token falls back to GIT_TOKEN.
      - NOTEBOOKS_GIT_REMOTE_URL=${NOTEBOOKS_GIT_REMOTE_URL:-}
      - NOTEBOOKS_GIT_BRANCH=${NOTEBOOKS_GIT_BRANCH:-main}
      - NOTEBOOKS_GIT_TOKEN=${NOTEBOOKS_GIT_TOKEN:-}
      - NOTEBOOKS_GIT_MODE=${NOTEBOOKS_GIT_MODE:-direct}
      - NOTEBOOKS_GIT_API_URL=${NOTEBOOKS_GIT_API_URL:-}
      - NOTEBOOKS_GIT_FORGE=${NOTEBOOKS_GIT_FORGE:-}
      # IP allowlist (Users & IAM > Network access). TRUSTED_PROXIES: CIDRs of reverse proxies whose X-Forwarded-For is believed (added to the setting).
      # IP_ALLOWLIST_OVERRIDE=off suspends enforcement (break-glass); MFA_POLICY_OVERRIDE=off does the same for the required-MFA policy.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - IP_ALLOWLIST_OVERRIDE=${IP_ALLOWLIST_OVERRIDE:-}
      - MFA_POLICY_OVERRIDE=${MFA_POLICY_OVERRIDE:-}
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./warehouse:/workspace/warehouse
      - ./web:/workspace/web
      # The dbt project (models + profiles.yml + dbt_project.yml). In production point DBT_PROJECT_HOST_DIR at a checkout of your OWN
      # project repository; an empty directory is seeded from web/dbt_template on first start. See .env.example.
      - ${DBT_PROJECT_HOST_DIR:-./dbt_project}:/workspace/dbt_project
      - ./docs:/workspace/docs
      - sandbox-secret:/run/sandbox:ro
      - controller-secret:/run/controller:ro
    networks:
      - default
      - sandbox-net
      - control-net
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped

  # One-shot initialisation (python -m web.init), same image: validates the bootstrap-admin settings, creates / migrates every database, seeds
  # the dbt project and checks the volumes BEFORE the studio starts. A misconfiguration fails here with a readable message instead of putting the
  # studio into a restart loop; on success the studio starts. Every step is idempotent (also run by the studio itself). In Kubernetes the same
  # command runs as an initContainer (deploy/helm/datakilnworks). `docker compose logs datakilnworks-init` shows the result.
  datakilnworks-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: localspark-lakehouse-notebook
    container_name: local-datakilnworks-init
    command: ["python", "-m", "web.init"]
    environment: *studio-env
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./warehouse:/workspace/warehouse
      - ./web:/workspace/web
      - ${DBT_PROJECT_HOST_DIR:-./dbt_project}:/workspace/dbt_project
    restart: "no"

  # Runs the notebook kernels of users a masking policy applies to. It has no warehouse mount, is alone with the studio on an
  # internal network (no internet, no compute nodes), and kernels read data only through the studio's governed endpoint.
  # See sandbox/worker.py.
  notebook-sandbox:
    image: localspark-lakehouse-notebook
    container_name: local-notebook-sandbox
    command: ["python", "-m", "uvicorn", "worker:app", "--app-dir", "/opt/sandbox", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    environment:
      - SANDBOX_GATEWAY_URL=http://datakilnworks-studio:8000
      - SANDBOX_MAX_ROWS=${SANDBOX_MAX_ROWS:-1000000}
    volumes:
      - ./sandbox:/opt/sandbox:ro
      - ./web/notebook_runner.py:/opt/runner/notebook_runner.py:ro
      - sandbox-secret:/run/sandbox
      - sandbox-state:/sandbox/state
    tmpfs:
      - /root
      - /tmp
    networks:
      - sandbox-net
    read_only: true
    cap_drop:
      - ALL
    cap_add:            # switching to per-user uids and preparing their homes
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 4G
          pids: 1024
    restart: unless-stopped

  # The only holder of the Docker socket: lets the studio stop / start / pause / unpause the compute-node containers behind
  # idle SQL warehouses, and nothing else (no exec, create, remove, images; allow-listed services of this project only,
  # token-authenticated, alone with the studio on an internal network). See controller/controller.py. Remove this service
  # (and the docker.sock mount with it) to run without container auto-suspend: warehouses then keep their flag-only behaviour.
  container-controller:
    image: localspark-lakehouse-notebook
    container_name: local-container-controller
    command: ["python", "-m", "uvicorn", "controller:app", "--app-dir", "/opt/controller", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    environment:
      - CONTROLLER_ALLOWED_SERVICES=compute-node-01,compute-node-02,compute-node-03
    volumes:
      - ./controller:/opt/controller:ro
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - controller-secret:/run/controller
    tmpfs:
      - /tmp
    networks:
      - control-net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128
    restart: unless-stopped

  compute-node-01:
    image: localspark-lakehouse-notebook
    depends_on:
      - datakilnworks-studio
    container_name: local-compute-node-01
    command: ["python", "-m", "uvicorn", "web.compute_worker:app", "--host", "0.0.0.0", "--port", "8001"]
    # Workers run arbitrary SQL, so they are reachable only on the compose network and require X-Compute-Token.
    expose:
      - "8001"
    environment:
      - WORKER_NODE_ID=compute-node-01
      - WORKER_NODE_NAME=Compute Worker 01 (Starter Node)
      - ASSIGNED_WAREHOUSE_ID=wh_starter
      - WAREHOUSE_DIR=/workspace/warehouse
      - MAX_MEMORY=2GB
      - THREADS=2
      - WORKER_PORT=8001
    volumes:
      - ./warehouse:/workspace/warehouse
      - ./web:/workspace/web
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped

  compute-node-02:
    image: localspark-lakehouse-notebook
    depends_on:
      - datakilnworks-studio
    container_name: local-compute-node-02
    command: ["python", "-m", "uvicorn", "web.compute_worker:app", "--host", "0.0.0.0", "--port", "8002"]
    # Workers run arbitrary SQL, so they are reachable only on the compose network and require X-Compute-Token.
    expose:
      - "8002"
    environment:
      - WORKER_NODE_ID=compute-node-02
      - WORKER_NODE_NAME=Compute Worker 02 (Analytics Pro)
      - ASSIGNED_WAREHOUSE_ID=wh_analytics_pro
      - WAREHOUSE_DIR=/workspace/warehouse
      - MAX_MEMORY=4GB
      - THREADS=4
      - WORKER_PORT=8002
    volumes:
      - ./warehouse:/workspace/warehouse
      - ./web:/workspace/web
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped

  compute-node-03:
    image: localspark-lakehouse-notebook
    depends_on:
      - datakilnworks-studio
    container_name: local-compute-node-03
    command: ["python", "-m", "uvicorn", "web.compute_worker:app", "--host", "0.0.0.0", "--port", "8003"]
    # Workers run arbitrary SQL, so they are reachable only on the compose network and require X-Compute-Token.
    expose:
      - "8003"
    environment:
      - WORKER_NODE_ID=compute-node-03
      - WORKER_NODE_NAME=Compute Worker 03 (ETL Batch)
      - ASSIGNED_WAREHOUSE_ID=wh_etl_batch
      - WAREHOUSE_DIR=/workspace/warehouse
      - MAX_MEMORY=4GB
      - THREADS=4
      - WORKER_PORT=8003
    volumes:
      - ./warehouse:/workspace/warehouse
      - ./web:/workspace/web
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped

networks:
  sandbox-net:
    internal: true
  control-net:
    internal: true

volumes:
  controller-secret:
  sandbox-secret:
  sandbox-state:
